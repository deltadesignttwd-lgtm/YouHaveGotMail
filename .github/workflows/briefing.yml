name: Daily Briefing

on:
  schedule:
    # 08:00 London = 07:00 UTC in summer (BST) and 08:00 UTC in winter (GMT).
    # Both fire; the script only sends from the one that matches 08:00 London today.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python briefing.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          SCHEDULE: ${{ github.event.schedule }}
          # Manual "Run workflow" clicks always send, regardless of the hour.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
